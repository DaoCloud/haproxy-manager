x-node: &node
  image: ${LAB_IMAGE:?}
  build:
    context: ../..
  cap_add: [NET_ADMIN, NET_BROADCAST, NET_RAW]
  environment:
    HAM_ADMIN_USER: admin
    HAM_ADMIN_PASSWORD: lab-demo-password
    HAM_DRY_RUN: "0"
    NO_PROXY: "*"
  stop_grace_period: 5s

services:
  proxy-a:
    <<: *node
    hostname: proxy-a
    ports: ["${LAB_UI_BIND:-127.0.0.1}:${LAB_UI_A_PORT:-18081}:8080"]
    networks:
      lab:
        ipv4_address: ${LAB_A:?}
    volumes:
      - a-data:/var/lib/haproxy-manager
      - a-acme:/var/lib/acme.sh
      - a-haproxy:/etc/haproxy
      - a-keepalived:/etc/keepalived

  proxy-b:
    <<: *node
    hostname: proxy-b
    ports: ["${LAB_UI_BIND:-127.0.0.1}:${LAB_UI_B_PORT:-18082}:8080"]
    networks:
      lab:
        ipv4_address: ${LAB_B:?}
    volumes:
      - b-data:/var/lib/haproxy-manager
      - b-acme:/var/lib/acme.sh
      - b-haproxy:/etc/haproxy
      - b-keepalived:/etc/keepalived

  backend:
    image: ${LAB_BACKEND_IMAGE:?}
    build:
      context: ../..
      dockerfile: tools/integration/Dockerfile
    hostname: backend
    user: "65534:65534"
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      LAB_A: ${LAB_A:?}
      LAB_B: ${LAB_B:?}
      LAB_BACKEND: ${LAB_BACKEND:?}
      LAB_VIP: ${LAB_VIP:?}
      LAB_PROJECT: ${LAB_PROJECT:?}
    networks:
      lab:
        ipv4_address: ${LAB_BACKEND:?}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  lab:
    ipam:
      config:
        - subnet: ${LAB_SUBNET:?}

volumes:
  a-data:
  a-acme:
  a-haproxy:
  a-keepalived:
  b-data:
  b-acme:
  b-haproxy:
  b-keepalived:

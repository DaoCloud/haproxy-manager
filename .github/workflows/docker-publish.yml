name: Build and publish the container image

# Publishes multi-architecture images to the GitHub Container Registry.
#
#   ghcr.io/<owner>/haproxy-manager:latest     the default branch or a stable release
#   ghcr.io/<owner>/haproxy-manager:V1.0.0     the exact Git tag, including case
#   ghcr.io/<owner>/haproxy-manager:sha-abc123 one exact commit
#   ghcr.io/<owner>/haproxy-manager:release-* the corresponding release tag
#
# amd64 builds natively; arm64 builds under QEMU emulation, which is slower but
# needs no self-hosted runner. Nothing here needs a secret: GITHUB_TOKEN can
# write to the registry once `packages: write` is granted below.
#
# A pull request that touches the image builds it for amd64 (without
# publishing) and starts it, so a version bump is proven before it is merged.

on:
  push:
    branches: [main]
    tags: ['v*', 'V*', 'release**']
    # Documentation-only commits do not change the image.
    paths-ignore:
      - '**.md'
  pull_request:
    paths:
      - Dockerfile
      - 'docker/**'
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Set the image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve the Git version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          sha=$(git rev-parse --short=7 HEAD)
          revision=$(git rev-parse HEAD)
          value="sha-$sha"
          latest=false
          prerelease=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
             { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; }; then
            latest=true
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            value="${GITHUB_REF#refs/tags/}"
            if [[ ! "$value" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Git tag cannot be used unchanged as a Docker tag: $value" >&2
              exit 1
            fi
            number="${value#release}"
            number="${number#[-_]}"
            number="${number#[vV]}"
            if [[ "$number" == *-* ]]; then
              prerelease=true
            else
              latest=true
            fi
          fi
          {
            echo "value=$value"
            echo "sha=$sha"
            echo "revision=$revision"
            echo "latest=$latest"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The action adds "latest" by itself to any type=ref,event=tag build
          # (flavor latest=auto), prerelease or not, so the rule below was
          # never the only say: 1.100.0-beta.1's tag build moved latest anyway.
          # Off here, so that rule is the only thing that sets it.
          flavor: |
            latest=false
          tags: |
            # Git tag builds keep the exact name. Other builds use sha-<commit>.
            # Only stable tags, default-branch pushes and manual builds move latest.
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=sha-${{ steps.version.outputs.sha }},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=HAProxy Cluster Manager
            org.opencontainers.image.description=Web UI for HAProxy, Keepalived and acme.sh
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      # A pull request builds one architecture into the local daemon, so the
      # check below can start it; everything else builds both and publishes.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proof the image runs on both architectures, rather than assuming a
      # successful build means a working container -- and a record, in the
      # run's summary, of what it carries.
      - name: Check both architectures start and answer
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            platforms=linux/amd64
            image="${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.value }}"
          else
            platforms="linux/amd64 linux/arm64"
            image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          fi
          echo "## Image contents" >> "$GITHUB_STEP_SUMMARY"
          for platform in $platforms; do
            echo "== $platform =="
            docker run -d --name check --platform "$platform" \
              -e HAM_ADMIN_PASSWORD=checkonly \
              "$image"
            for i in $(seq 60); do
              if docker exec check curl -fsS http://127.0.0.1:8080/api/whoami >/dev/null 2>&1; then
                echo "   the UI answered"
                docker exec check /usr/bin/python3 -c \
                  'import platform;print("   running on", platform.machine())'
                break
              fi
              [ "$i" = 60 ] && { docker logs check; exit 1; }
              sleep 2
            done
            {
              echo "**$platform**"
              echo
              echo '```'
              docker exec check sh -c '. /etc/os-release; echo "$PRETTY_NAME"'
              docker exec check haproxy -v | head -1
              docker exec check keepalived --version 2>&1 | head -1
              docker exec check /opt/acme.sh/acme.sh --version | tail -1 | sed 's/^/acme.sh /'
              docker exec check python3 --version
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            docker rm -f check >/dev/null
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null; then
            echo "Release $TAG already exists."
            exit 0
          fi
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$TAG" "${args[@]}"

name: Build and publish the container image

# Publishes multi-architecture images to the GitHub Container Registry.
#
#   ghcr.io/<owner>/haproxy-manager:latest     the default branch or a stable release
#   ghcr.io/<owner>/haproxy-manager:1.46       the contents of VERSION
#   ghcr.io/<owner>/haproxy-manager:sha-abc123 one exact commit
#   ghcr.io/<owner>/haproxy-manager:release-* the corresponding release tag
#
# amd64 builds natively; arm64 builds under QEMU emulation, which is slower but
# needs no self-hosted runner. Nothing here needs a secret: GITHUB_TOKEN can
# write to the registry once `packages: write` is granted below.
#
# The image is also rebuilt once a week whether or not anything was pushed, and
# that build ignores the layer cache. The image carries Debian, HAProxy,
# Keepalived and acme.sh, and all but acme.sh are installed by one apt-get
# layer whose text never changes -- so a cached build would keep serving the
# packages of the day the cache was made, security updates included. The
# weekly build publishes the same tags with fresh packages underneath, exactly
# as the official library images do. Pull again to pick it up.
#
# A pull request that touches the image builds it for amd64 (without
# publishing) and starts it, so a version bump is proven before it is merged.

on:
  push:
    branches: [main]
    tags: ['v*', 'release**']
    # Documentation-only commits do not change the image.
    paths-ignore:
      - '**.md'
  pull_request:
    paths:
      - Dockerfile
      - 'docker/**'
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: '23 5 * * 1'      # Mondays, 05:23 UTC: fresh Debian and HAProxy packages
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Set the image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Read the version
        id: version
        run: |
          {
            echo "value=$(tr -d ' \n' < VERSION)"
            echo "sha=$(git rev-parse --short=7 HEAD)"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The action adds "latest" by itself to any type=ref,event=tag build
          # (flavor latest=auto), prerelease or not, so the rule below was
          # never the only say: 1.100.0-beta.1's tag build moved latest anyway.
          # Off here, so that rule is the only thing that sets it.
          flavor: |
            latest=false
          tags: |
            # "latest" is the default branch: a build there, a manual or weekly
            # rebuild of it, or a release tag on a version without a
            # prerelease mark. A beta's tag build must not move it -- it did
            # once, and a pull of the plain image name got the beta.
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(steps.version.outputs.value, '-')) }}
            # Always tag with VERSION, on a branch build and a tag build alike,
            # so `docker pull …:1.48.0` works whichever triggered it and the
            # image tag matches the file the app reports.
            type=raw,value=${{ steps.version.outputs.value }}
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=raw,value=sha-${{ steps.version.outputs.sha }}
          labels: |
            org.opencontainers.image.title=HAProxy Cluster Manager
            org.opencontainers.image.description=Web UI for HAProxy, Keepalived and acme.sh
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      # A pull request builds one architecture into the local daemon, so the
      # check below can start it; everything else builds both and publishes.
      # The scheduled build starts from nothing: no layer cache, and a fresh
      # pull of the base image.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proof the image runs on both architectures, rather than assuming a
      # successful build means a working container -- and a record, in the
      # run's summary, of what it carries.
      - name: Check both architectures start and answer
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            platforms=linux/amd64
            image="${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.value }}"
          else
            platforms="linux/amd64 linux/arm64"
            image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          fi
          echo "## Image contents" >> "$GITHUB_STEP_SUMMARY"
          for platform in $platforms; do
            echo "== $platform =="
            docker run -d --name check --platform "$platform" \
              -e HAM_ADMIN_PASSWORD=checkonly \
              "$image"
            for i in $(seq 60); do
              if docker exec check curl -fsS http://127.0.0.1:8080/api/whoami >/dev/null 2>&1; then
                echo "   the UI answered"
                docker exec check /usr/bin/python3 -c \
                  'import platform;print("   running on", platform.machine())'
                break
              fi
              [ "$i" = 60 ] && { docker logs check; exit 1; }
              sleep 2
            done
            {
              echo "**$platform**"
              echo
              echo '```'
              docker exec check sh -c '. /etc/os-release; echo "$PRETTY_NAME"'
              docker exec check haproxy -v | head -1
              docker exec check keepalived --version 2>&1 | head -1
              docker exec check /opt/acme.sh/acme.sh --version | tail -1 | sed 's/^/acme.sh /'
              docker exec check python3 --version
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            docker rm -f check >/dev/null
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null; then
            echo "Release $TAG already exists."
            exit 0
          fi
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$TAG" "${args[@]}"
